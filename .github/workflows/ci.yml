name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore BlazorApi.slnx

      - name: Vulnerability scan
        shell: bash
        run: |
          dotnet list BlazorApi.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Build
        run: dotnet build BlazorApi.slnx -c Release --no-restore

      # Unit, golden-file, compilation, integration, source generator, CLI and Blazor tests, plus the demo tests.
      - name: Test
        run: dotnet test BlazorApi.slnx -c Release --no-build --verbosity normal

      # The generated code under tests/Golden must match the generator (the golden tests fail otherwise); this also
      # demonstrates the CI usage of api-gen --check.
      - name: Generated code is up to date
        shell: bash
        run: |
          dotnet src/BlazorApi.Cli/bin/Release/net10.0/api-gen.dll validate tests/Contracts/petstore.yaml --strict
          dotnet src/BlazorApi.Cli/bin/Release/net10.0/api-gen.dll diff demo/Contracts/baseline/petstore.yaml demo/Contracts/petstore.yaml --format markdown

      # Native AOT: a client generated with generateJsonContext=true is published with PublishAot (trim and AOT
      # warnings are errors), with reflection-based JSON disabled, and run against `api-gen mock`.
      - name: Native AOT smoke test
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          api_gen="dotnet src/BlazorApi.Cli/bin/Release/net10.0/api-gen.dll"
          $api_gen generate tests/Contracts/petstore.yaml --output tests/BlazorApi.AotSmoke/Generated --namespace AotSmoke.Petstore --option generateJsonContext=true --quiet
          dotnet publish tests/BlazorApi.AotSmoke -c Release -r linux-x64 -p:PublishAot=true -warnaserror -o artifacts/aot
          $api_gen mock tests/Contracts/petstore.yaml --port 4010 &
          mock=$!
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/4010) 2>/dev/null && break; sleep 1; done
          status=0
          artifacts/aot/BlazorApi.AotSmoke http://localhost:4010/v1/ || status=$?
          kill $mock
          exit $status

      - name: Pack
        if: matrix.os == 'windows-latest'
        run: dotnet pack BlazorApi.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
