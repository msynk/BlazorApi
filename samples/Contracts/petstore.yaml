openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A sample API exercising the features the generator supports.
servers:
  - url: https://{environment}.example.com/v1
    variables:
      environment:
        default: api
        enum: [api, staging]
security:
  - bearerAuth: []
tags:
  - name: pets
    description: Pet operations
  - name: store
    description: Store operations
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      description: Returns pets one page at a time.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          description: The cursor returned by the previous page.
          schema:
            type: string
        - name: tags
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PetStatus'
        - name: X-Request-Id
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of pets
          headers:
            X-Total-Count:
              description: The total number of pets.
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: The pet identifier.
        schema:
          type: integer
          format: int64
    get:
      operationId: getPet
      tags: [pets]
      summary: Get a pet
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    patch:
      operationId: patchPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PetPatch'
      responses:
        '200':
          description: Patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      operationId: deletePet
      tags: [pets]
      deprecated: true
      responses:
        '204':
          description: Deleted
  /pets/{petId}/photo:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: downloadPetPhoto
      tags: [pets]
      responses:
        '200':
          description: The photo
          content:
            image/png:
              schema:
                type: string
                format: binary
    post:
      operationId: uploadPetPhoto
      tags: [pets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoInfo'
  /store/orders:
    post:
      operationId: placeOrder
      tags: [store]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /store/inventory:
    get:
      operationId: getInventory
      tags: [store]
      security:
        - apiKey: []
      responses:
        '200':
          description: Quantities by status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health status
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: The maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    PetStatus:
      type: string
      description: The adoption status.
      enum: [available, pending, sold]
    Pet:
      type: object
      description: A pet.
      required: [id, name, kind]
      discriminator:
        propertyName: kind
        mapping:
          dog: '#/components/schemas/Dog'
          cat: '#/components/schemas/Cat'
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
        status:
          $ref: '#/components/schemas/PetStatus'
        tag:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
          readOnly: true
        owner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Owner'
        attributes:
          type: object
          additionalProperties:
            type: string
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            barkVolume:
              type: number
              format: double
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required: [indoor]
          properties:
            indoor:
              type: boolean
    NewPet:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        tag:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PetStatus'
    PetPatch:
      type: object
      properties:
        name:
          type: string
        tag:
          type: string
          nullable: true
    PetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        nextCursor:
          type: string
          nullable: true
    Owner:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        manager:
          $ref: '#/components/schemas/Owner'
    PhotoInfo:
      type: object
      required: [url, size]
      properties:
        url:
          type: string
          format: uri
        size:
          type: integer
          format: int64
    Order:
      type: object
      properties:
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        complete:
          type: boolean
          default: false
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
